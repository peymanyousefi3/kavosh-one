# Dedicated Kavosh One cluster: peer-only local administration, verified TLS
# and SCRAM for the two independent web logins. No network admin login.
local all postgres peer
local all all peer
hostnossl all all 127.0.0.1/32 reject
hostssl kavosh_one kavosh_one_web,kavosh_one_identity 127.0.0.1/32 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::/0 reject
