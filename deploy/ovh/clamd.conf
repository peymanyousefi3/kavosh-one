# Dedicated private Kavosh One instance; no public TCP listener or path scans.
Foreground yes
LocalSocket /run/kavosh-one-scanner/clamd.sock
LocalSocketGroup kavosh-one-inspection
LocalSocketMode 660
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
CVDCertsDirectory /etc/clamav/certs
OfficialDatabaseOnly yes
TemporaryDirectory /tmp
MaxThreads 1
MaxQueue 2
StreamMaxLength 64M
MaxFileSize 64M
MaxScanSize 128M
MaxScanTime 100000
MaxRecursion 16
MaxFiles 10000
AlertExceedsMax yes
AlertEncrypted yes
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
ScanPE yes
ScanELF yes
Bytecode yes
BytecodeSecurity TrustSigned
BytecodeMode ForceInterpreter
BytecodeTimeout 10000
ReadTimeout 15
CommandReadTimeout 10
SendBufTimeout 10
SelfCheck 600
ConcurrentDatabaseReload no
LeaveTemporaryFiles no
LogClean no
LogVerbose no
ExtendedDetectionInfo no
EnableShutdownCommand no
EnableReloadCommand no
EnableStatsCommand no
EnableVersionCommand yes
