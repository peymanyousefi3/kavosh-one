name: Secret safety
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Alert-check privacy and failure logic (no GitHub API or credential access)
        run: node --test tests/github-secret-alerts.test.mjs
      - name: Verify official scanner checksum and scan complete history
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d "$RUNNER_TEMP/kavosh-secrets.XXXXXX")"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$scan_dir/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt --output "$scan_dir/checksums.txt"
          awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print}' "$scan_dir/checksums.txt" | (cd "$scan_dir" && sha256sum --strict --check -)
          tar -xzf "$scan_dir/gitleaks_8.30.1_linux_x64.tar.gz" -C "$scan_dir" gitleaks
          GITLEAKS_BIN="$scan_dir/gitleaks" node scripts/check-secrets.mjs
