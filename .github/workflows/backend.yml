name: Backend foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Real PostgreSQL integration tests
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/postgres
      - name: Migration is repeatable without reapplying existing SQL
        run: pnpm db:migrate && pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/postgres
          DATABASE_SSL_MODE: disable
      - run: pnpm build
      - run: pnpm test:http
      - run: pnpm audit --prod --audit-level high
