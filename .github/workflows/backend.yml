name: Backend foundation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: API contract matches the implemented schemas
        run: pnpm api:generate && git diff --exit-code -- public/openapi.json
      - run: pnpm test
      - name: Real PostgreSQL integration tests
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/postgres
      - name: Migration is repeatable without reapplying existing SQL
        run: pnpm db:migrate && pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/postgres
          DATABASE_SSL_MODE: disable
      - run: pnpm build
      - run: pnpm test:http
      - run: pnpm audit --prod --audit-level high
      - name: Build VPS container
        run: docker build --tag kavosh-one:ci .
      - name: Run non-root container with a read-only filesystem
        run: docker run --detach --name kavosh-one-ci --publish 127.0.0.1:3198:3000 --read-only --tmpfs /tmp kavosh-one:ci
      - name: Verify the actual standalone container
        run: pnpm test:http
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3198
      - name: Remove disposable test container
        if: always()
        run: docker rm --force kavosh-one-ci || true
