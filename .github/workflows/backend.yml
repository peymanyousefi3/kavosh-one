name: Backend foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run both complete database suites, including large-load cases (release/milestone gate)
        type: boolean
        default: false
        required: false
permissions:
  contents: read
# Keep each checkpoint's evidence. Do not cancel an earlier run when another
# commit is pushed, including when GitHub is slow to finalize its run status.
jobs:
  verify:
    runs-on: ubuntu-latest
    # Run41804739143 hit20m at the final container HTTP check after its full
    # suites/build passed. Leave headroom for runner variation and coverage.
    # Keep shared-role tests serial; production limits/assertions are unchanged.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Focused signing transport and original-byte verification
        run: node --import tsx --test --test-concurrency=1 tests/boldsign.test.ts tests/boldsign-template.test.ts tests/boldsign-template-pdf.test.ts tests/boldsign-send-request.test.ts
      - name: Focused agreement-content persistence and private source approvals
        run: node --import tsx --test --test-concurrency=1 --test-skip-pattern='one hundred simultaneous' tests/agreement-content.test.ts tests/agreement-package-content.test.ts tests/agreement-packages.test.ts tests/signature-sends.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/postgres
      - name: Compile the isolated notification daemon without a TypeScript runtime
        run: pnpm notifications:build
      - name: Focused report publication, shared evidence and time persistence
        run: node --import tsx --test --test-concurrency=1 tests/session-evidence-report.test.ts tests/poll-template-use.test.ts tests/poll-templates.test.ts tests/poll-response-moderation.test.ts tests/poll-results.test.ts tests/poll-responses.test.ts tests/poll-answer.test.ts tests/date-time-input.test.ts tests/polls.test.ts tests/report-comments.test.ts tests/homework-solutions.test.ts tests/homework-grades.test.ts tests/homework-submissions.test.ts tests/homeworks.test.ts tests/student-feedback.test.ts tests/assessment-rubrics.test.ts tests/report-publications.test.ts tests/session-reports.test.ts tests/session-attendance.test.ts tests/session-time.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/postgres
      - name: API contract matches the implemented schemas
        run: pnpm api:generate && git diff --exit-code -- public/openapi.json
      # Routine updates prioritize focused business/security/accounting logic.
      # Full cross-engine/load coverage remains an explicit release gate.
      - name: Focused PostgreSQL business logic checks
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.full_suite }}
        run: pnpm test:quick
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/postgres
          NOTIFICATION_WORKER_COMPILED_ENTRY: .notification-worker/scripts/process-notifications.js
      - name: Complete embedded-database suite (explicit milestone run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
        run: pnpm test
      - name: Complete PostgreSQL suite (explicit milestone run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/postgres
      - name: Migration is repeatable without reapplying existing SQL
        run: pnpm db:migrate && pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/postgres
          DATABASE_SSL_MODE: disable
      - run: pnpm build
      - run: pnpm test:http
      - run: pnpm audit --prod --audit-level high
      - name: Build the minimal non-root notification worker
        run: docker build --file Dockerfile.notification-worker --tag kavosh-notifications:ci .
      - name: Verify the isolated worker defaults off with a read-only filesystem
        run: |
          set +e
          task_worker_output=$(docker run --rm --read-only --tmpfs /tmp --network none --cap-drop ALL --security-opt no-new-privileges:true kavosh-notifications:ci 2>&1)
          task_worker_status=$?
          set -e
          printf '%s\n' "$task_worker_output"
          test "$task_worker_status" -eq 1
          printf '%s\n' "$task_worker_output" | grep -F 'Notification worker stopped; check isolated configuration without logging credentials.'
      - name: Verify actual worker UID, minimal dependencies and read-only application directory
        run: |
          docker run --rm --read-only --tmpfs /tmp --network none --cap-drop ALL --security-opt no-new-privileges:true --entrypoint node kavosh-notifications:ci --input-type=module -e '
            import {writeFileSync,readFileSync,statSync} from "node:fs";
            import pg from "pg";
            import {z} from "zod";
            if(process.getuid()===0||process.env.NODE_ENV!=="production"||!pg.Pool||!z.object)throw Error("WORKER_RUNTIME_INVALID");
            if(statSync("/app/package.json").uid!==process.getuid())throw Error("WORKER_FILE_OWNER_INVALID");
            try{writeFileSync("/app/package.json","probe");throw Error("APPLICATION_FILES_WRITABLE");}catch(error){if(error.code!=="EROFS")throw error;}
            const status=readFileSync("/proc/self/status","utf8");if(!/^CapEff:\s+0+$/m.test(status)||!/^NoNewPrivs:\s+1$/m.test(status))throw Error("WORKER_ISOLATION_INVALID");
            for(const name of ["next","tsx"]){try{import.meta.resolve(name);throw Error("UNNECESSARY_RUNTIME_DEPENDENCY");}catch(error){if(error.code!=="ERR_MODULE_NOT_FOUND")throw error;}}
          '
      - name: Build VPS container
        run: docker build --tag kavosh-one:ci .
      - name: Run non-root container with a read-only filesystem
        run: docker run --detach --name kavosh-one-ci --publish 127.0.0.1:3198:3000 --read-only --tmpfs /tmp kavosh-one:ci
      - name: Verify the actual standalone container
        run: pnpm test:http
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3198
      - name: Remove disposable test container
        if: always()
        run: docker rm --force kavosh-one-ci || true
  image-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build minimal distribution-Node image validator
        run: docker build --file Dockerfile.image-service --tag kavosh-image:ci .
      - name: Refuse a runtime missing required isolation controls
        run: |
          if docker run --rm --network none kavosh-image:ci; then
            echo 'Unsafe image-service startup was accepted'
            exit 1
          fi
      - name: Run actual isolated resource-limited native image service
        run: >-
          docker run --detach --name kavosh-image-ci --network none --read-only
          --cap-drop ALL --security-opt no-new-privileges:true
          --memory 1g --memory-swap 1g --cpus 1 --pids-limit 64
          --tmpfs /run/kavosh-image:rw,noexec,nosuid,nodev,size=1m,uid=10002,gid=10001,mode=0750
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10002,gid=10001,mode=0700
          kavosh-image:ci
      - name: Verify actual PIE/cgroup/security controls and full native socket decoding
        run: docker exec kavosh-image-ci node scripts/image-service-smoke.mjs
      - name: Verify graceful service shutdown
        run: |
          docker stop --time 10 kavosh-image-ci
          test "$(docker inspect --format '{{.State.ExitCode}}' kavosh-image-ci)" = 0
      - name: Remove disposable image-service container
        if: always()
        run: docker rm --force kavosh-image-ci || true
  scanner-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Install actual scanner engine on the disposable CI runner
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends clamav-daemon
      - name: Actual isolated ClamAV engine with harmless test signature (not production signatures)
        run: node --import tsx --test tests/clamav-engine.test.ts
        env:
          TEST_CLAMD_BINARY: /usr/sbin/clamd
